name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-intel
            runner: macos-13
            args: --target x86_64-apple-darwin
          - platform: windows-x64
            runner: windows-latest
            args: ''
          - platform: linux-x64
            runner: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev pkg-config cmake libde265-dev libx265-dev

      - name: Build libheif from source (Linux)
        # Ubuntu's libheif-dev is older than what libheif-sys 3.x requires (>= 1.18).
        if: matrix.platform == 'linux-x64'
        run: |
          git clone --depth 1 --branch v1.18.2 https://github.com/strukturag/libheif.git /tmp/libheif
          cmake -S /tmp/libheif -B /tmp/libheif/build -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_BUILD_TYPE=Release -DWITH_EXAMPLES=OFF -DBUILD_TESTING=OFF
          cmake --build /tmp/libheif/build --parallel $(nproc)
          sudo cmake --install /tmp/libheif/build
          sudo ldconfig

      - name: Install macOS dependencies
        if: startsWith(matrix.platform, 'macos')
        run: brew install libheif pkg-config

      - name: Install Windows dependencies (libheif via vcpkg)
        if: matrix.platform == 'windows-x64'
        shell: bash
        run: |
          vcpkg install libheif:x64-windows-static-md
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          echo "VCPKGRS_DYNAMIC=1" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, create release, and upload bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ScanSplit ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
